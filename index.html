<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.6;
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #a0a0a0;
            font-weight: 400;
        }

        .upload-container {
            background: #1a1a1a;
            padding: 32px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            margin-bottom: 32px;
        }

        .upload-container h3 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }

        .upload-container p {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 24px;
            text-align: center;
        }

        .file-input-wrapper {
            margin-bottom: 24px;
        }

        .file-input-label {
            display: inline-block;
            padding: 14px 20px;
            background-color: #0f0f0f;
            border: 2px solid #3a3a3a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #e5e5e5;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
        }

        .file-input-label:hover {
            background-color: #151515;
            border-color: #4a4a4a;
        }

        #pdfInput {
            display: none;
        }

        .file-name {
            margin-top: 12px;
            font-size: 14px;
            color: #c0c0c0;
            font-weight: 500;
            text-align: center;
        }

        .btn {
            background-color: #ffffff;
            color: #0a0a0a;
            padding: 14px 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
            display: block;
            margin: 0 auto;
        }

        .btn:hover:not(:disabled) {
            background-color: #e5e5e5;
        }

        .btn:disabled {
            background-color: #2a2a2a;
            color: #666666;
            cursor: not-allowed;
        }

        .loader {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background-color: #151515;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            text-align: center;
        }

        .loader-text {
            font-size: 14px;
            color: #e5e5e5;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .loader-detail {
            font-size: 13px;
            color: #a0a0a0;
        }

        .grid {
            display: none;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .card {
            background: #1a1a1a;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            border-left: 3px solid #ffffff;
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #ffffff;
        }

        .content {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #d0d0d0;
            font-size: 14px;
        }

        .verdict {
            border-left-color: #ffffff;
            grid-column: 1 / -1;
        }

        .offer {
            border-left-color: #ffffff;
        }

        .life {
            border-left-color: #ffffff;
        }

        .risk {
            border-left-color: #ffffff;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .verdict {
                grid-column: 1 / -1;
            }

            .risk {
                grid-column: 1 / -1;
            }

            .btn {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Contract Analyzer</h1>
            <p class="subtitle">AI-powered contract analysis with specialized agents</p>
        </header>

        <div class="upload-container">
            <h3>Upload Contract</h3>
            <p>Upload a PDF file for comprehensive analysis by specialized AI agents</p>
            
            <div class="file-input-wrapper">
                <label for="pdfInput" class="file-input-label">
                    Choose PDF File
                </label>
                <input type="file" id="pdfInput" accept=".pdf">
                <div class="file-name" id="fileName"></div>
            </div>

            <button class="btn" onclick="runAnalysis()" id="btnRun">Analyze Contract</button>
            
            <div class="loader" id="loader">
                <div class="loader-text">Processing contract...</div>
                <div class="loader-detail">Running 4 specialized agents sequentially</div>
            </div>
        </div>

        <div id="resultsArea" class="grid">
            <div class="card verdict">
                <h2>Executive Verdict</h2>
                <div id="out_verdict" class="content"></div>
            </div>

            <div class="card offer">
                <h2>The Offer</h2>
                <div id="out_offer" class="content"></div>
            </div>

            <div class="card life">
                <h2>Lifestyle & IP</h2>
                <div id="out_life" class="content"></div>
            </div>

            <div class="card risk">
                <h2>Legal Risks</h2>
                <div id="out_risk" class="content"></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('pdfInput');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files[0]) {
                fileName.textContent = 'Selected: ' + e.target.files[0].name;
            } else {
                fileName.textContent = '';
            }
        });

        async function runAnalysis() {
            if (!fileInput.files[0]) {
                alert("Please upload a PDF file.");
                return;
            }

            document.getElementById('btnRun').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsArea').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const res = await fetch('http://127.0.0.1:8000/analyze-contract', {
                    method: 'POST',
                    body: formData
                });
                
                if (!res.ok) throw new Error("Server Error");
                const data = await res.json();

                // FIX: Helper function to convert newlines to HTML breaks
                const formatText = (text) => {
                    return text.replace(/\n/g, "<br>");
                };

                // FIX: Use innerHTML to render the <b> tags
                document.getElementById('out_offer').innerHTML = formatText(data.analysis.part_1_the_offer);
                document.getElementById('out_life').innerHTML = formatText(data.analysis.part_2_lifestyle_and_ip);
                document.getElementById('out_risk').innerHTML = formatText(data.analysis.part_3_legal_traps);
                document.getElementById('out_verdict').innerHTML = formatText(data.analysis.part_4_executive_verdict);

                document.getElementById('resultsArea').style.display = 'grid';

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('btnRun').disabled = false;
            }
        }
    </script>
</body>
</html>
